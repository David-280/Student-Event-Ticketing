<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: "Inter", sans-serif;
    text-align: center;
    background: #020617;
    color: white;
    padding: 40px 20px;
}
h1 {
    font-size: 2rem;
    margin-bottom: 15px;
}
#reader {
    width: 320px;
    margin: 20px auto;
    border-radius: 12px;
    overflow: hidden;
}
#result {
    margin-top: 25px;
    font-size: 1.3rem;
    font-weight: 600;
}
</style>
</head>

<body>

<h1>Scan Ticket QR Code</h1>

<div id="reader"></div>
<div id="result">Waiting for scan...</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const qr = new Html5Qrcode("reader");

qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decoded) => {
        document.getElementById("result").innerHTML = "Ticket Found:<br><br>" + decoded;
        qr.stop();
    }
);
</script>

</body>
</html>
